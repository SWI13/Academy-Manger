# Production stack.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# What differs from the development file is not "the same thing with DEBUG
# off". Three structural changes:
#
#   1. Only Nginx publishes a port. Django, Next, PostgreSQL, Redis and the
#      object store are reachable on the internal network and nowhere else.
#      "Django is not routed publicly" stops being a convention here and
#      becomes a fact about the network.
#   2. No source is mounted. The images carry the code, so what was tested is
#      what runs.
#   3. Postgres and Redis have no published ports at all - not even bound to
#      localhost. A database reachable from the host is a database reachable
#      from anything that gets onto the host.

name: sm-academy-prod

x-backend-image: &backend-image
  build:
    context: ./backend
    target: prod
  # One image, three commands. The code that validates a payment in a request
  # is the code that validates it in a task.
  image: sm-academy-backend:prod
  env_file: .env.prod
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    # env_file, not `environment: ${...}`. Those are two different mechanisms
    # reading two different files: `${...}` is substituted from `.env` in the
    # project directory, while `env_file` is what the container gets. With
    # substitution here, a `docker compose -f docker-compose.prod.yml up`
    # without `--env-file .env.prod` silently initialises the database with
    # the *development* password and nothing complains until the first
    # migration fails on authentication - by which point the volume exists
    # and has to be destroyed to fix it.
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      # $$ escapes compose substitution so the shell inside the container
      # expands these from its own environment - the same .env.prod every
      # other setting here comes from.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Sessions live here. `appendonly yes` means a restart does not sign the
    # whole institute out mid-transaction, which `--save ""` in development
    # cheerfully does.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    # Same reasoning as postgres. MINIO_ROOT_USER and MINIO_ROOT_PASSWORD are
    # the S3 credentials under MinIO's own names, and .env.prod carries both
    # spellings so nothing here needs substituting.
    env_file: .env.prod
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the private bucket once, then exits. The development stack has
  # the same step; leaving it out here would mean the first payment proof
  # upload fails against a bucket that does not exist.
  minio-init:
    image: minio/mc:latest
    env_file: .env.prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$S3_BUCKET_NAME &&
      mc anonymous set none local/$$S3_BUCKET_NAME &&
      echo 'bucket ready and private'
      "

  backend:
    <<: *backend-image
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --timeout 60
      --access-logfile -
      --error-logfile -
    healthcheck:
      # Two headers, both required, and both were missing at first:
      #
      #   Host - production ALLOWED_HOSTS is the public hostname, so a plain
      #   request to localhost is rejected as DisallowedHost with 400.
      #
      #   X-Forwarded-Proto - SECURE_SSL_REDIRECT is on, and an internal
      #   request over plain HTTP is answered with a 301 to https.
      #
      # curl -f treats both as failure, so without them the container sits
      # unhealthy forever and anything waiting on service_healthy never
      # starts. `localhost` is in ALLOWED_HOSTS for exactly this call.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Host: localhost' -H 'X-Forwarded-Proto: https'
          http://127.0.0.1:8000/api/v1/health/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend-image
    command: celery -A config worker --loglevel=info --concurrency=2

  beat:
    <<: *backend-image
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: runner
    image: sm-academy-frontend:prod
    environment:
      NODE_ENV: production
      # Internal. The browser never sees this value.
      DJANGO_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      - frontend
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
