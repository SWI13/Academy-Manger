# Development stack only. Production compose + Nginx land in Phase 19.
#
#   docker compose up -d          start everything
#   docker compose logs -f backend
#   docker compose exec backend python manage.py migrate
#   docker compose exec backend pytest

name: sm-academy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the private bucket once, then exits. Not a long-running service.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET_NAME} &&
      mc anonymous set none local/${S3_BUCKET_NAME} &&
      echo 'bucket ${S3_BUCKET_NAME} ready and private'
      "

  backend:
    build:
      context: ./backend
      target: dev
    # web, worker and beat share one image name on purpose. With three
    # separate build blocks Compose produced three images that drifted the
    # moment a dependency was added to only one of them - which is exactly
    # what "same image, different command" is supposed to prevent.
    image: sm-academy-backend:dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: dev
    image: sm-academy-backend:dev
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      target: dev
    image: sm-academy-backend:dev
    # --schedule keeps beat's state file out of the mounted source tree; by
    # default it writes celerybeat-schedule into the working directory, which
    # here is your checkout.
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    image: sm-academy-frontend:dev
    command: npm run dev
    environment:
      # Inside the network Django is reachable by service name. This value is
      # never sent to the browser - Next calls Django, the browser calls Next.
      #
      # Set here rather than left to frontend/.env.local, which the bind mount
      # below would otherwise carry into the container pointing at localhost.
      # A real environment variable wins over a .env file in Next, so this is
      # the authoritative value whichever way the container is started.
      DJANGO_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Anonymous volumes so the container keeps its own Linux-built
      # node_modules and .next rather than having the host's shadow them.
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
