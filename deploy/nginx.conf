# The only thing in this stack with a published port.
#
# Two upstreams and no third: everything a browser asks for goes to Next, and
# signed object-storage URLs go to MinIO. There is deliberately no location
# block that reaches Django. It is not that requests to it are blocked here -
# there is no route to write, because the container publishes no port and
# Nginx never names it.

upstream nextjs {
    server frontend:3000;
}

upstream objectstore {
    server minio:9000;
}

# Everything over TLS. The redirect is here rather than only in Django's
# SECURE_SSL_REDIRECT so that a plaintext request never reaches an application
# at all.
server {
    listen 80;
    server_name _;

    # Certbot's HTTP-01 challenge is the one thing that legitimately arrives
    # on port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Payment proofs are capped at 10 MB by the signed upload policy itself.
    # This is the same ceiling stated one layer earlier, so an oversized body
    # is refused before it is buffered.
    client_max_body_size 12m;

    # Uploads and downloads go browser <-> bucket. They pass through here
    # because MinIO is not published either, but they are never buffered:
    # holding a 10 MB scan in Nginx before forwarding it is the same mistake
    # as routing it through gunicorn, one layer out.
    location /storage/ {
        include /etc/nginx/conf.d/security-headers.conf;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://objectstore;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        client_max_body_size 12m;
    }

    location /_next/static/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        # Immutable, content-hashed filenames. Safe to cache hard, and this is
        # the only thing here that is.
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads these two to build absolute URLs and to know the
        # request arrived over TLS. Without them DRF's pagination `next`
        # names the container, and SECURE_SSL_REDIRECT loops.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 75s;

        # Nothing here is cacheable. Every response is scoped to one caller,
        # and a shared cache keyed on a URL would serve one family's payment
        # history to another. Listed after the include, because add_header
        # accumulates within a block even though it does not inherit across
        # one.
        add_header Cache-Control "no-store" always;
    }
}
