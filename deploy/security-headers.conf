# Included into every location block, not set once at server level.
#
# Nginx's add_header does not merge: a single add_header inside a location
# REPLACES every add_header inherited from the server block. So a location
# that sets its own Cache-Control silently drops HSTS and the rest, and the
# only symptom is a header quietly missing from responses. Including the list
# everywhere is the ugly-but-correct answer.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
