name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Real PostgreSQL, not SQLite: the row locks, partial unique constraints
    # and JSONB columns this platform depends on do not exist on SQLite, and a
    # suite that passes on a database we do not ship proves nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sm_academy
          POSTGRES_USER: sm_academy
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_DEBUG: "false"
      POSTGRES_DB: sm_academy
      POSTGRES_USER: sm_academy
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-only-password
      S3_BUCKET_NAME: sm-academy-test
      S3_REGION: us-east-1
      PUBLIC_SITE_URL: http://localhost:3000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate

      - name: Test
        run: pytest --cov=apps --cov-report=term-missing
